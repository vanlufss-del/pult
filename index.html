<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d3202a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Встречи">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Встречи с клиентами</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky header (client + stage tabs); laptop = stage content + right rail with live summary; phone = one column. Client map is a separate red/white sheet that prints on one A4. */
:root{
  --bg:#ffffff; --surface:#f7f3f3; --line:#e6dcdc; --fg:#1d1617; --muted:#6f6264;
  --accent:#d3202a; --accent-soft:#fde8e9; --on-accent:#ffffff;
  --ok:#1d7a46; --ok-soft:#e3f3ea; --warn:#a85d00; --warn-soft:#fff1dc;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141011; --surface:#1f191a; --line:#352b2c; --fg:#f3eded; --muted:#a8999b;
  --accent:#ff4d55; --accent-soft:#3a1517; --on-accent:#ffffff;
  --ok:#5fd394; --ok-soft:#14301f; --warn:#ffb54d; --warn-soft:#33240f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141011; --surface:#1f191a; --line:#352b2c; --fg:#f3eded; --muted:#a8999b;
  --accent:#ff4d55; --accent-soft:#3a1517; --on-accent:#ffffff;
  --ok:#5fd394; --ok-soft:#14301f; --warn:#ffb54d; --warn-soft:#33240f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px 0}
.brand{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.who{flex:1 1 200px;min-width:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b{color:var(--fg)}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;cursor:pointer;font-weight:600;font-size:13px}
.ibtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:10px 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.tab b{font-family:var(--display);font-size:10px;color:var(--muted);font-weight:500}
.tab.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab.active b{color:inherit;opacity:.7}
.tab.client{border-color:var(--accent);color:var(--accent)}
.tab.client.active{background:var(--accent);color:var(--on-accent)}

main{padding-block:18px 56px}
.layout{display:block}
.panel>*+*{margin-top:14px}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.lead{color:var(--muted);margin:4px 0 0;max-width:64ch}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.say{font-size:16px;line-height:1.5;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.say+.say{margin-top:8px}
.nm{color:var(--accent);font-weight:700}
.tip{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.tip b{color:var(--warn)}
.note{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}

/* question items */
.it{padding:11px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.it:first-child{border-top:0;padding-top:2px}
.it .q{font-weight:600}
.it .h{color:var(--muted);font-size:13px;margin-top:-3px}
.it input[type=text],.it textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;width:100%;min-width:0;font-size:15px}
.it textarea{min-height:58px;resize:vertical}
.it input.num{max-width:240px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:0 0 auto}
.chk.done span{color:var(--muted);text-decoration:line-through}
.chk small{display:block;font-weight:400;color:var(--muted);font-size:13px;text-decoration:none}
.utp .chk span{font-weight:400;font-size:15px}
.utp .chk span b{display:block;font-weight:700}

.cols{display:grid;gap:14px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.r{border-radius:12px;padding:12px;background:var(--bg);border:1px solid var(--line)}
.r span{display:block;font-size:12px;color:var(--muted)}
.r b{font-family:var(--display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.r.key{background:var(--accent-soft);border-color:var(--accent)}
.r.good{background:var(--ok-soft);border-color:var(--ok)}
.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ledger td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.ledger td:last-child{text-align:right;white-space:nowrap;padding-left:12px;font-weight:600}
.ledger td small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.ledger tr.total td{border-top:2px solid var(--fg);font-weight:700;font-size:17px}

/* price corridor */
.corr{position:relative;height:64px;margin:8px 4px 4px}
.corr .band{position:absolute;top:26px;height:12px;border-radius:6px;background:var(--ok-soft);border:1px solid var(--ok)}
.corr .axis{position:absolute;top:31px;left:0;right:0;height:2px;background:var(--line)}
.mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mk i{width:2px;height:38px;background:currentColor;margin-top:2px}
.mk.exp{color:var(--accent)} .mk.ad{color:var(--warn)}
.corr .lb{position:absolute;top:44px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}

/* risks */
.risks{display:flex;flex-direction:column;gap:6px}
.risk{border-left:3px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;padding:8px 10px;font-size:14px}
.risk.ok{border-left-color:var(--ok)}

details.obj{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
details.obj+details.obj{margin-top:8px}
details.obj summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary::after{content:"+";color:var(--accent)}
details.obj[open] summary::after{content:"−"}
details.obj .in{padding:0 14px 14px}
details.obj .in p{margin:0} details.obj .in p+p{margin-top:8px}
details.obj .in em{font-style:normal;color:var(--muted);font-size:12px;display:block;text-transform:uppercase;letter-spacing:.06em}

.rail{display:none}
.out{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:420px;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.arch{display:flex;flex-direction:column;gap:6px}
.arch div{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.arch div span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== client map: own fixed red/white palette, same in both themes ===== */
.sheet{--p-red:#d3202a;--p-ink:#1d1617;--p-mut:#6b5f61;--p-line:#eadede;--p-soft:#fdf0f0;
  background:#fff;color:var(--p-ink);border-radius:16px;border:1px solid var(--line);overflow:hidden;max-width:820px;margin:0 auto}
.sh-head{background:var(--p-red);color:#fff;padding:22px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ava{width:68px;height:68px;border-radius:50%;background:#fff;color:var(--p-red);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;overflow:hidden;flex:0 0 auto;border:3px solid rgba(255,255,255,.6)}
.ava img{width:100%;height:100%;object-fit:cover}
.sh-head .t{flex:1 1 240px;min-width:0}
.sh-head .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.sh-head h1{font-family:var(--display);font-weight:700;font-size:22px;margin:4px 0 2px;line-height:1.2;text-wrap:balance}
.sh-head .s{font-size:14px;opacity:.92}
.sh-body{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.sh-sec h4{font-family:var(--display);font-size:13px;font-weight:700;color:var(--p-red);margin:0 0 8px;letter-spacing:.02em;text-transform:uppercase}
.goal{font-size:16px;line-height:1.5;background:var(--p-soft);border-radius:12px;padding:12px 14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--p-line)}
.steps li:first-child{border-top:0}
.steps .when{font-weight:700;color:var(--p-red);font-size:13px}
.steps .what b{display:block}
.steps .what span{color:var(--p-mut);font-size:14px}
.docs{columns:2;column-gap:24px;margin:0;padding:0;list-style:none}
.docs li{break-inside:avoid;padding:4px 0 4px 24px;position:relative;font-size:14px}
.docs li::before{content:"";position:absolute;left:0;top:7px;width:13px;height:13px;border:2px solid var(--p-red);border-radius:3px}
.docs li small{color:var(--p-mut)}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.money div{border:1px solid var(--p-line);border-radius:12px;padding:10px 12px}
.money span{display:block;font-size:12px;color:var(--p-mut)}
.money b{font-family:var(--display);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.money .hl{background:var(--p-red);border-color:var(--p-red);color:#fff}
.money .hl span{color:#fff;opacity:.85}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duo ul{margin:0;padding-left:18px;font-size:14px}
.duo li+li{margin-top:4px}
.guar{border:2px solid var(--p-red);border-radius:12px;padding:12px 14px;font-size:14px}
.guar b{color:var(--p-red)}
.sh-foot{border-top:1px solid var(--p-line);padding:14px 24px;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;align-items:center}
.sh-foot b{font-family:var(--display);font-weight:700;color:var(--p-red);margin-right:auto}
.sh-foot small{display:block;width:100%;color:var(--p-mut);font-size:11px}

@media (max-width:600px){.docs{columns:1}.duo{grid-template-columns:1fr}.steps li{grid-template-columns:1fr;gap:2px}.sh-head,.sh-body,.sh-foot{padding-left:16px;padding-right:16px}}
@media (min-width:1000px){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
  .rail{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);max-height:calc(100vh - 128px);overflow:auto}
  .rail>*+*{margin-top:12px}
  .layout.wide{grid-template-columns:minmax(0,1fr)}
  .layout.wide .rail{display:none}
  .cols{grid-template-columns:1fr 1fr}
}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  header,.rail,.noprint,.panel>:not(.sheet){display:none!important}
  main{padding:0}
  .sheet{border:0;border-radius:0;max-width:none;font-size:12px}
  .sheet .sh-head{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:14px 18px}
  .sheet .money .hl,.goal{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sh-body{padding:10px 18px;gap:8px}
  .sh-head h1{font-size:17px} .ava{width:50px;height:50px;font-size:16px}
  .sh-sec h4{font-size:11px;margin-bottom:4px}
  .goal{font-size:12px;padding:7px 10px}
  .steps li{grid-template-columns:92px 1fr;padding:3px 0;gap:8px}
  .steps .when{font-size:10.5px}
  .steps .what b{display:inline;font-size:12px} .steps .what b::after{content:" — "}
  .steps .what span{font-size:11px}
  .docs li{font-size:11px;padding:2px 0 2px 20px} .docs li::before{top:4px;width:10px;height:10px}
  .money div{padding:6px 10px} .money b{font-size:14px}
  .guar{font-size:11px;padding:8px 10px}
  .sh-foot{padding:8px 18px;font-size:12px}
  .full-only{display:none!important}
}
@media (prefers-reduced-motion:no-preference){.tab,.chip{transition:background .15s,color .15s,border-color .15s}}
</style>

</head><body>
<style>
.cloud.ok{color:var(--ok)}.cloud.warn{color:var(--accent);border-color:var(--accent)}
a.ibtn{text-decoration:none;color:var(--fg);display:inline-block}
.ctimer{display:flex;align-items:center;gap:6px}
.clock{font-family:var(--display);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.clock.late{color:var(--accent)}
.tab.now{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.ckbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ckbar b{font-family:var(--display);font-weight:500;font-size:15px;margin-right:4px}
.ckbar span{border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:2px 7px}
.ckbar.done{border-color:var(--ok)} .ckbar.done b{color:var(--ok)}
.cklist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.cklist div::before{content:"○ ";color:var(--accent)} .cklist div.ok{color:var(--muted)} .cklist div.ok::before{content:"✓ ";color:var(--ok)}
.casecard{border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:14px;font-size:16px}
.casecard i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px}
.typechip{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 8px;white-space:nowrap}
.start{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard b{font-family:var(--display);font-weight:700;font-size:15px}
.tcard span{color:var(--muted);font-size:13px}
.tcard i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.logo{height:26px;width:auto;display:block;margin-left:auto;align-self:flex-start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{border:1px solid var(--p-line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:22px;font-weight:500;color:var(--p-red)}
.stats span{font-size:12px;color:var(--p-mut)}
@media (max-width:600px){.stats{grid-template-columns:1fr 1fr}.logo{margin-left:0}}
@media print{.logo{height:20px}.stats b{font-size:16px}.stats div{padding:5px}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Встречи <i>с клиентами</i></div>
      <span class="typechip" id="typechip" hidden></span><div class="ctimer" id="ctimer" hidden><span class="clock" id="clock">15:00</span><button class="ibtn primary" id="tgo" type="button">Старт</button><button class="ibtn" id="treset" type="button" aria-label="Сбросить таймер">↺</button></div>
      <div class="who" id="who"></div>
      <button class="ibtn cloud" id="cloud" type="button" hidden></button><button class="ibtn" id="setBtn" type="button" aria-label="Настройки">Настройки</button><button class="ibtn" id="newMeet" type="button">Новая встреча</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Этапы встречи"></nav>
  </div>
</header>

<main class="wrap">
  <div class="layout" id="layout">
    <section class="panel" id="panel"></section>
    <aside class="rail" id="rail"></aside>
  </div>
</main>

try{const r=localStorage.getItem('vstrechi2');if(r)S=Object.assign(S,JSON.parse(r));
 else{const o=localStorage.getItem('vstrechaProdavec');if(o){const p=JSON.parse(o);S.arch=(p.arch||[]).map(m=>Object.assign(m,{type:'so'}));if(p.cur&&Object.keys(p.cur.f||{}).length){p.cur.type='so';S.arch.unshift(p.cur);}S.photo=p.photo||'';}}}catch(e){}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const x=parseFloat(String(v||'').replace(/\s/g,'').replace(/[^\d.,]/g,'').replace(',','.'));return isNaN(x)?0:x;};
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const mln=n=>(n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:2})+' млн';
const nm=()=>esc((F().name||'').trim()||'Имя');
const N=()=>'<span class="nm">'+nm()+'</span>';
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
const kind=()=>{if(!T())return '';if(S.cur.type==='cert')return F().ck||'ex';return T().kind;};
function isEx(){return S.cur.type==='ex'||(S.cur.type==='cert'&&kind()==='ex');}
const TF_DEF={sPct:2.8,sMin:72000,s8:2.4,bPct:2,bMin:72000,zBase:72000,zPct:1.6,exD:5,gp:4000};
function TF(){const t=Object.assign({},TF_DEF),u=(S.profile||{}).tf||{};Object.keys(t).forEach(k=>{const v=parseFloat(String(u[k]||'').replace(',','.'));if(!isNaN(v))t[k]=v;});return t;}
const pc=v=>String(v).replace('.',',')+'%';

/* ================= LOGIC ================= */
function isAlt(f){return isEx()||(f.buyNext&&!['Ничего','Пока не решили'].includes(f.buyNext))||arr(f.why).some(x=>x.startsWith('Обмен'));}
function sellComm(p){const t=TF();return p<=0?0:p<8e6?Math.max(t.sPct/100*p,t.sMin):t.s8/100*p;}
function zagSellComm(p){const t=TF();return p<=0?0:p<=2e6?t.zBase:p<=8e6?t.zBase+t.zPct/100*p:t.s8/100*p;}
const isLand=v=>v==='Дом'||v==='Дача / участок';
function buyComm(p,seg,disc){const t=TF();if(p<=0||seg==='Новостройка')return 0;let c=seg==='Дом'?(p<=2e6?t.zBase:t.zBase+t.zPct/100*p):Math.max(t.bPct/100*p,t.bMin);return disc?c*(1-t.exD/100):c;}
function minTerm(f){return (['Наследство','Приватизация','Дарение'].includes(f.basis)||f.onlyHome==='Да')?3:5;}
function tax(f,p){const y=num(f.years);if(!f.basis||f.years===undefined||f.years==='')return 0;if(y>=minTerm(f))return 0;
 const base=Math.max(0,p-Math.max(num(f.buyPrice),1e6));return base<=2.4e6?base*.13:2.4e6*.13+(base-2.4e6)*.15;}
function annuity(L,r,y){if(L<=0||!y)return 0;const i=r/1200,n=y*12;return i?L*i/(1-Math.pow(1+i,-n)):L/n;}
function kidsShares(f){return (f.msk&&f.msk!=='Нет')||f.minors==='Да';}
function sellCalc(){const f=F(),p=num(f.dealPrice)||num(f.expect)||num(f.adprice),k=sellComm(p),m=f.mort==='Да'?num(f.mortLeft):0,
 no=kidsShares(f)?num(f.notary):0,t=tax(f,p),o=num(f.other);
 const p2=f.second&&f.second!=='Нет'?num(f.secondPrice):0,k2=p2?(isLand(f.second)?zagSellComm(p2):sellComm(p2)):0;
 return {p,k,m,no,t,o,p2,k2,net:p+p2-k-k2-m-no-t-o};}
function buyCalc(extraOwn){const f=F(),seg=S.cur.type==='nb'?'Новостройка':(f.seg||'Вторичка'),p=num(f.bprice)||num(f.budget);
 const k=buyComm(p,seg,isEx()),own=num(f.own)+(extraOwn||0),msk=num(f.mskSum),cert=num(f.cert);
 const mortOn=arr(f.pay).includes('Ипотека')||(S.cur.type==='nb'&&f.program&&f.program!=='Без ипотеки');
 const gp=num(f.gp),ocen=mortOn?(seg==='Дом'?5000:3000):0,ins=mortOn?num(f.ins):0,er=num(f.ereg),sa=num(f.safe);
 const costs=k+gp+ocen+ins+er+sa;const loan=mortOn?Math.max(0,p-own-msk-cert):0;
 const pm=annuity(loan,num(f.rate),num(f.term)||20);
 return {p,seg,k,own,msk,cert,gp,ocen,ins,er,sa,costs,loan,pm,mortOn,gap:mortOn?0:Math.max(0,p+costs-own-msk-cert)};}
function risks(){const f=F(),r=[],t=S.cur.type,k=kind();if(!k)return r;
 if(k==='sell'||k==='ex'){const p=num(f.expect)||num(f.adprice),mx=num(f.mktMax),mn=num(f.mktMin);
  if(p&&mx&&p>mx)r.push('Цена выше рынка на '+Math.round((p/mx-1)*100)+'% — тест 3 недели и отчёт');
  if(p&&mn&&p<mn)r.push('Цена ниже рынка — можно продать дороже');
  if(f.msk==='Да, доли не выделены')r.push('Маткапитал: доли не выделены — нотариус до продажи');
  if(kidsShares(f))r.push('Доли детей: сделка у нотариуса (расходы), разрешение опеки, детям — доли не меньше в новом жилье');
  if(f.second&&f.second!=='Нет')r.push('Второй объект ('+f.second.toLowerCase()+') — продаётся дольше, начинаем сразу'+(isLand(f.second)?'; документы на дом и землю, оценка дома для банка 5 000':''));
  if(f.mort==='Да')r.push('Ипотека'+(f.mortBank?' ('+f.mortBank+')':'')+': справка об остатке, согласование с банком');
  if(f.spouse==='Да')r.push('Нужно нотариальное согласие супруга');
  if(num(f.owners)>1)r.push('Собственников '+num(f.owners)+' — все участвуют в сделке');
  if(f.replan==='Есть, не узаконена')r.push('Неузаконенная перепланировка — проблема для ипотечного покупателя');
  if(f.debts==='Есть')r.push('Долги ЖКХ — погасить до сделки');
  if(num(f.reg)>0)r.push('Прописано '+num(f.reg)+' — срок выписки в договоре');
  const c=sellCalc();if(c.t>0)r.push('Срок владения меньше '+minTerm(f)+' лет — возможен налог ≈ '+rub(c.t));
  if(t!=='ex'&&isAlt(f))r.push('Клиент ещё и покупатель — предложить встречную сделку');}
 if(t==='ih'){if(f.inhStatus&&f.inhStatus!=='Свидетельство получено, право зарегистрировано')r.push('Право ещё не зарегистрировано — продать можно только после регистрации');
  if(f.heirsAgree&&f.heirsAgree!=='Все согласны')r.push('Не все наследники готовы — сначала договорённость');
  if(f.heirsWhere)r.push('Наследники в другом городе — доверенность или онлайн-подписание');}
 if(k==='buy'||k==='nb'||k==='ex'){const b=buyCalc(k==='ex'?Math.max(sellCalc().net,0):0);
  if(b.mortOn&&f.approved!=='Есть одобрение')r.push('Нет одобрения ипотеки — сначала заявка в ипотечный отдел');
  if(f.approved==='Был отказ')r.push('Был отказ банка — разобрать причину с брокером');
  if(arr(f.pay).includes('Маткапитал'))r.push('Маткапитал — справка об остатке из Соцфонда, доли детям');
  if(b.mortOn&&num(f.payWant)&&b.pm>num(f.payWant))r.push('Платёж '+rub(b.pm)+' выше комфортного '+rub(num(f.payWant)));
  if(arr(f.pay).includes('Продажа своей')&&t!=='ex')r.push('Покупка зависит от продажи — предложить встречную сделку (тип «Обмен»)');}
 if(arr(f.decide).some(x=>x!=='Только он(а)'))r.push('Решение принимает не один — пригласить '+arr(f.decide).filter(x=>x!=='Только он(а)').join(', ').toLowerCase());
 if(k==='rev'){const p=num(f.curPrice),mx=num(f.mktMax);if(p&&mx&&p>mx)r.push('Цена выше рынка на '+Math.round((p/mx-1)*100)+'%');
  if(num(f.rdays)>=14&&!num(f.rshows))r.push('Нет показов за '+num(f.rdays)+' дней — цена или подача не работают');
  if(num(f.calls)&&!num(f.rshows))r.push('Звонки есть, показов нет — проверить, что отпугивает в разговоре');
  if(num(f.rshows)>=3)r.push('Показы есть, задатка нет — разобрать обратную связь покупателей');}
 return r;}

function item(it){const f=F();if(it.show&&!it.show(f))return'';
 if(it.t==='check'){const c=!!f[it.id];return '<div class="it"><label class="chk'+(c?' done':'')+'"><input type="checkbox" data-k="'+it.id+'"'+(c?' checked':'')+'><span>'+esc(it.q)+'</span></label></div>';}
 let h='<div class="it"><div class="q">'+esc(it.q)+'</div>'+(it.h?'<div class="h">'+esc(it.h)+'</div>':'');
 if(it.t==='text')h+='<input type="text" id="f-'+it.id+'" data-k="'+it.id+'" value="'+esc(f[it.id])+'" autocomplete="off">';
 if(it.t==='num')h+='<input type="text" class="num" inputmode="numeric" id="f-'+it.id+'" data-k="'+it.id+'" value="'+esc(f[it.id])+'" autocomplete="off">';
 if(it.t==='area')h+='<textarea id="f-'+it.id+'" data-k="'+it.id+'">'+esc(f[it.id])+'</textarea>';
 if(it.t==='one'||it.t==='many'){const v=arr(f[it.id]);h+='<div class="chips">'+it.o.map(o=>'<button type="button" class="chip'+(v.includes(o)?' on':'')+'" data-ch="'+it.id+'" data-m="'+(it.t==='many'?1:0)+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';}
 return h+'</div>';}

function utpBox(list){const f=F(),l=list.filter(u=>!u[3]||u[3](f)).sort((a,b)=>(b[3]?1:0)-(a[3]?1:0)),d=l.filter(u=>C()[u[0]]).length;
 return '<div class="box utp"><h3>УТП · озвучено '+d+' из '+l.length+'</h3>'+l.map(([id,t,p,c])=>{const k=!!C()[id];return '<div class="it"><label class="chk'+(k?' done':'')+'"><input type="checkbox" data-c="'+id+'"'+(k?' checked':'')+'><span><b>'+t+(c?' · по ситуации':'')+'</b>'+p+'</span></label></div>';}).join('')+'</div>';}
function objBox(list){return '<div class="steps-o note" style="font-size:14px">Выслушать → «С чем связано?» → «Только это?» → «Согласен с вами…» → «Вместе с этим…» → «Согласны?»</div>'+

function corridor(cur,curLbl){const f=F(),mn=num(f.mktMin),mx=num(f.mktMax),e=num(cur),a=num(f.adprice);if(!(mn&&mx&&mx>mn))return'';
 const vals=[mn,mx,e,a].filter(Boolean),lo=Math.min(...vals)*.95,hi=Math.max(...vals)*1.05,pos=v=>((v-lo)/(hi-lo)*100).toFixed(1)+'%';
 return `<div class="box"><h3>Рыночный коридор</h3><div class="corr"><div class="axis"></div><div class="band" style="left:${pos(mn)};width:calc(${pos(mx)} - ${pos(mn)})"></div>
  <div class="lb" style="left:${pos(mn)}">${mln(mn)}</div><div class="lb" style="left:${pos(mx)}">${mln(mx)}</div>
  ${e?`<div class="mk exp" style="left:${pos(e)}">${curLbl} ${mln(e)}<i></i></div>`:''}${a&&a!==e&&S.cur.type!=='rv'?`<div class="mk ad" style="left:${pos(a)}">объявл. ${mln(a)}<i></i></div>`:''}</div>
  <p class="note" style="margin:6px 0 0">Зелёная полоса — где реально продаются похожие квартиры.</p></div>`;}

function certTimer(){const on=S.cur.type==='cert';$('#ctimer').hidden=!on;if(!on){clearInterval(tickT);tickT=null;return;}
 const t=S.cur.t||(S.cur.t={left:900,run:false,ts:0});
 const left=()=>t.run?Math.max(0,t.left-(Date.now()-t.ts)/1000):t.left;
 const draw=()=>{const l=left(),m=Math.floor(l/60),sec=Math.floor(l%60);$('#clock').textContent=m+':'+String(sec).padStart(2,'0');$('#clock').classList.toggle('late',l<=180);
  $('#tgo').textContent=t.run?'Пауза':(l<900?'Дальше':'Старт');const el=900-l;let acc=0,now=null;
  Object.entries(CERT_STAGES).forEach(([id,mn])=>{if(now===null&&el<acc+mn*60)now=id;acc+=mn*60;});
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('now',t.run&&b.dataset.t===now));
  if(t.run&&l<=0){t.left=0;t.run=false;saveLocal();}};
 $('#tgo').onclick=()=>{if(t.run){t.left=left();t.run=false;}else{t.run=true;t.ts=Date.now();if(S.tab==='c_case')go('c_contact');}saveLocal();draw();};
 $('#treset').onclick=()=>{t.left=900;t.run=false;saveLocal();draw();};
 draw();if(!tickT)tickT=setInterval(draw,500);}

 async readAll(){const id=await this.sheetId(),u=r=>'https://sheets.googleapis.com/v4/spreadsheets/'+id+'/values/'+encodeURIComponent(r);
  let rows=[],prof=null;
  try{rows=((await this.api(u('Встречи!A2:M'))).values)||[];}catch(e){if(e.code===404||e.code===400){G.set('sid','');throw{code:'gone',msg:'Таблица не найдена — создам новую при следующей синхронизации'};}throw e;}
  try{const p=(await this.api(u('Профиль!A1'))).values;if(p&&p[0]&&p[0][0])prof=JSON.parse(p[0][0]);}catch(e){}
  const meetings=rows.map(r=>{try{const m=JSON.parse(r[12]||'{}');m.id=m.id||+r[0];if(r[2]==='1')m.deleted=true;m.updated=+r[1]||m.updated||0;return m;}catch(e){return null;}}).filter(m=>m&&m.id);
  return {meetings,profile:prof};},
 async writeAll(meetings,profile){const id=await this.sheetId(),u=r=>'https://sheets.googleapis.com/v4/spreadsheets/'+id+'/values/'+encodeURIComponent(r)+'?valueInputOption=RAW';
  const rows=[COLS].concat(meetings.map(m=>m.deleted?[String(m.id),String(m.updated||0),'1','','','','','','','','','','{"id":'+m.id+'}']:
   [String(m.id),String(m.updated||0),'',m.date||'',(TYPES[m.type]||{}).label||'',m.f.name||'',m.f.phone||'',m.f.addr||'',m.f.temp||'',m.f.nextContact||'',m.f.contract||'',textOf(m),JSON.stringify(m)]));
  await this.api(u('Встречи!A1:M'+rows.length),{method:'PUT',body:JSON.stringify({values:rows})});
  const p=Object.assign({},profile);await this.api(u('Профиль!A1:B1'),{method:'PUT',body:JSON.stringify({values:[[JSON.stringify(p),'профиль агента — не редактировать']]})});},

const Sync={state:'off',busy:false,timer:null,err:'',
 on:()=>CLOUD_OK&&!!G.get('on',false)&&!!cid(),
 signIn(prompt){if(!cid()){go('set');return;}const st=Math.random().toString(36).slice(2);G.set('state',st);G.set('try',Date.now());saveLocal();
  const q=new URLSearchParams({client_id:cid(),redirect_uri:baseUrl(),response_type:'token',scope:CFG.scopes,include_granted_scopes:'true',state:st});
  if(prompt)q.set('prompt',prompt);const h=G.get('email','');if(h)q.set('login_hint',h);location.href='https://accounts.google.com/o/oauth2/v2/auth?'+q;},
 async signOut(wipe){const t=token();G.set('tok',null);G.set('on',false);G.set('sid','');G.set('email','');
  if(t)try{await fetch('https://oauth2.googleapis.com/revoke?token='+t,{method:'POST'});}catch(e){}
  if(wipe){try{localStorage.removeItem('vstrechi2');}catch(e){}S={cur:blank(''),arch:[],tab:'start',photo:'',profile:{},del:{}};saveLocal();}
  this.state='off';this.pill();go('start');},
 later(){if(!this.on())return;this.state='dirty';this.pill();clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),2500);},
 boot(){if(!CLOUD_OK)return;
  if(/access_token=|error=/.test(location.hash)){const p=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname+location.search);
   if(p.get('state')===G.get('state','')){if(p.get('access_token')){G.set('tok',{t:p.get('access_token'),exp:Date.now()+(+p.get('expires_in')||3600)*1000});G.set('on',true);G.set('needTap',false);
     GoogleStore.who().then(e=>{if(e){G.set('email',e);this.pill();}});}
    else G.set('needTap',true);}}
  if(this.on()){if(token())setTimeout(()=>this.run(),300);else if(!G.get('needTap',false)&&Date.now()-G.get('try',0)>10*60000)this.signIn('none');else{this.state='login';}}
  this.pill();
  window.addEventListener('focus',()=>{if(this.on()&&token()&&Date.now()-(G.get('last',0))>60000)this.run();});},
 async run(manual){if(!this.on()||this.busy)return;if(!token()){this.state='login';this.pill();return;}
  this.busy=true;this.state='sync';this.pill();
  try{const R=await Store.readAll(),map={};
   const local=[S.cur].concat(S.arch).filter(m=>m&&m.type);
   local.forEach(m=>{map[m.id]=m;});
   Object.entries(S.del).forEach(([id,ts])=>{map[id]={id:+id,deleted:true,updated:ts};});
   let curChanged=false;
   R.meetings.forEach(r=>{const l=map[r.id];if(!l||(r.updated||0)>(l.updated||0)){map[r.id]=r;if(S.cur.id===r.id)curChanged=true;}});
   const all=Object.values(map);
   const live=all.filter(m=>!m.deleted);
   if(curChanged){const n=map[S.cur.id];if(n&&!n.deleted)S.cur=n;else S.cur=blank('');}
   if(map[S.cur.id]&&map[S.cur.id].deleted)S.cur=blank('');
   S.arch=live.filter(m=>m.id!==S.cur.id).sort((a,b)=>(b.updated||0)-(a.updated||0));
   Object.keys(S.del).forEach(id=>{if(!map[id]||map[id].deleted)delete S.del[id];});
   if(R.profile&&(R.profile.updated||0)>(S.profile.updated||0))S.profile=R.profile;
   await Store.writeAll(all.sort((a,b)=>a.id-b.id),S.profile);
   G.set('last',Date.now());this.state='ok';this.err='';saveLocal();
   if(curChanged||manual||['start','set','sum'].includes(S.tab))go(S.tab,true);
  }catch(e){this.state=e.code===401?'login':'err';this.err=e.msg||(e.code?'код '+e.code:String(e));
   if(e.code===403)this.err=/scope/i.test(this.err)?'Нет доступа к Диску: нажми «Выйти», войди снова и поставь галочку у пункта про Google Диск':this.err+' — проверь, что в Google Cloud включён Google Sheets API';}
  this.busy=false;this.pill();},
 pill(){const b=$('#cloud');if(!b)return;if(!CLOUD_OK||!G.get('on',false)){b.hidden=true;return;}b.hidden=false;
  const m={ok:['✓ Сохранено','ok'],dirty:['Сохраняю…',''],sync:['Синхронизация…',''],login:['Войти в Google','warn'],err:['Ошибка — повторить','warn'],off:['Облако','']}[this.state]||['Облако',''];
  b.textContent=m[0];b.className='ibtn cloud '+m[1];b.title=this.err||'';}};
