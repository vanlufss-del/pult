html,body{margin:0}

:root{

}

table{border-collapse:collapse;width:100%;font-size:14px}

.foot{margin-top:24px;font-size:12px;color:var(--muted)}
@media (max-width:380px){.prices{grid-template-columns:repeat(3,minmax(0,1fr))}nav button{font-size:12px}}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .18s ease-out}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

function pickZK(){

    if(pb.when==="2027"&&z.ready>2027.4)return false;
    return z.p[r]<=b*1.15})

}

  ${OBJ.map((o,i)=>{const zk=state.vzk&&o.zk&&o.zk[state.vzk];return `<details class="obj"${i===0?" open":""}><summary>«${esc(o.q)}»</summary><div class="ob">
    <p><span class="t">Присоединение</span>${esc(o.j)}</p><p><span class="t">Аргумент</span>${esc(o.a)}</p>
    ${zk?`<p class="zk"><b>Для этого ЖК:</b> ${esc(zk)}</p>`:""}
    <p class="q">${esc(o.c)}</p></div></details>`}).join("")}`;
}
/* ---------- Сравнение ---------- */
let cmp=store.get("cmp",["tom","luchi"]);
function sravnHTML(){
  const sel=(i)=>`<select id="c${i}">${ZK.map(z=>`<option value="${z.id}" ${cmp[i]===z.id?"selected":""}>${esc(z.n)}</option>`).join("")}</select>`;
  const a=ZK.find(z=>z.id===cmp[0]),b=ZK.find(z=>z.id===cmp[1]);
  const row=(l,x,y,win)=>`<tr><th>${l}</th><td class="${win===0?"win":""}">${x}</td><td class="${win===1?"win":""}">${y}</td></tr>`;
  const lo=(k)=>{const x=a.p[k],y=b.p[k];if(x==null||y==null)return -1;return x<y?0:y<x?1:-1};
  return `<div class="cmp-sel">${sel(0)}${sel(1)}</div>
  <div class="tbl"><table>
   ${row("Застройщик",esc(DEV[a.d].n),esc(DEV[b.d].n))}
   ${row("Район",esc(a.r),esc(b.r))}
   ${row("Класс",esc(a.cls),esc(b.cls))}
   ${row("Дом",esc(a.tech),esc(b.tech))}
   ${row("Отделка",esc(a.fin),esc(b.fin))}
   ${row("Сдача",esc(a.sd),esc(b.sd),a.ready<b.ready?0:b.ready<a.ready?1:-1)}
   ${row("Ключи",esc(a.keys),esc(b.keys))}
   ${row("Эскроу",esc(a.esc),esc(b.esc))}
   ${ROOMS.map(([k,l])=>row(l+" от, млн",fmt(a.p[k]),fmt(b.p[k]),lo(k))).join("")}
   ${row("Главное",esc(a.one),esc(b.one))}
  </table></div>
  <p class="note">Зелёным — где выгоднее (дешевле или раньше въезд). Про конкурента говорим только факты, без негатива.</p>
  <h3>Как сформулировать</h3>
  <p>«${esc(a.n)} — ${esc(a.one.toLowerCase())} ${esc(b.n)} — ${esc(b.one.toLowerCase())} Что для вас важнее?»</p>`;
}
/* ---------- bindings ---------- */

  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.open});
  const back=$("[data-back]");if(back)back.onclick=()=>{location.hash="zhk"};
  const q=$("#q");if(q){q.oninput=()=>{state.q=q.value;$("#zlist").innerHTML=filtered().map(z=>rowHTML(z)).join("")||'<div class="empty">Ничего не нашлось</div>';bindOpen()}}
  document.querySelectorAll("[data-dist]").forEach(b=>b.onclick=()=>{state.dist=b.dataset.dist;render()});
  document.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{pb.room=b.dataset.room;store.set("pb",pb);render()});
  document.querySelectorAll("[data-when]").forEach(b=>b.onclick=()=>{pb.when=b.dataset.when;store.set("pb",pb);render()});
  const bu=$("#budget");if(bu)bu.onchange=()=>{pb.budget=+bu.value.replace(",",".")||pb.budget;store.set("pb",pb);render()};
  const pd=$("#pdist");if(pd)pd.onchange=()=>{pb.dist=pd.value;store.set("pb",pb);render()};

  document.querySelectorAll("[data-cmp]").forEach(b=>b.onclick=()=>{cmp[0]=b.dataset.cmp;if(cmp[1]===cmp[0])cmp[1]=ZK.find(z=>z.id!==cmp[0]).id;store.set("cmp",cmp);location.hash="sravn"});
}
function bindOpen(){document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.open})}
/* ---------- 5-minute timer ---------- */
let tleft=300,tint=null;const tb=$("#timer");
const tshow=()=>{const m=Math.floor(tleft/60),s=String(tleft%60).padStart(2,"0");tb.textContent=(tleft<=0?"Время! ":"⏱ ")+m+":"+s};
tb.onclick=()=>{
  if(tint){clearInterval(tint);tint=null;tleft=300;tb.className="timer";tshow();return}
  tleft=300;tb.className="timer run";tshow();
  tint=setInterval(()=>{tleft--;tshow();if(tleft<=0){clearInterval(tint);tint=null;tb.className="timer end"}},1000);
};
/* ---------- data from the Google Sheet ---------- */
function parseCSV(t){const out=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===","){row.push(f);f=""} else if(c==="\n"){row.push(f);out.push(row);row=[];f=""} else if(c!=="\r")f+=c}
  if(f!==""||row.length){row.push(f);out.push(row)} return out}
const toM=v=>{const n=String(v||"").replace(/[^\d]/g,"");return n?+n/1000:null};
function applySheet(rows){
  const h=rows[0].map(x=>x.trim().toLowerCase());const col=k=>h.findIndex(x=>x.startsWith(k));
  const C={id:col("id"),sd:col("сдача"),keys:col("ключи"),ready:col("въезд"),st:col("студия"),k1:col("1к"),k2:col("2к"),k3:col("3к"),k4:col("4к"),pn:col("примечание"),esc:col("эскроу"),promo:col("акция"),chk:col("сверено")};
  if(C.id<0)return false;let dates=[],n=0;
  rows.slice(1).forEach(r=>{const z=ZK.find(x=>x.id===(r[C.id]||"").trim());if(!z)return;n++;
    if(r[C.sd])z.sd=r[C.sd]; if(r[C.keys])z.keys=r[C.keys];
    const rd=(r[C.ready]||"").replace(/\D/g,""); if(rd.length===5)z.ready=+rd.slice(0,4)+ +rd[4]/10;
    ["st","k1","k2","k3","k4"].forEach(k=>{if(C[k]>=0){const v=toM(r[C[k]]);if(v==null)delete z.p[k];else z.p[k]=v}});
    if(C.pn>=0)z.pn=r[C.pn]||""; if(C.esc>=0&&r[C.esc])z.esc=r[C.esc];
    z.promo=C.promo>=0?(r[C.promo]||"").trim():""; z.chk=C.chk>=0?(r[C.chk]||"").trim():"";
    if(z.chk)dates.push(z.chk)});
  if(!n)return false;
  const toD=s=>{const m=s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):null};
  const best=dates.map(d=>[d,toD(d)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1])[0];
  if(best)DATA_DATE=best[0];return true}
const cached=store.get("sheet",null);
if(cached&&cached.rows&&applySheet(cached.rows)){DATA_SRC="сохранённая копия"}
stampText();
route();
fetch(SHEET_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
  if(/^\s*</.test(t))throw 0; const rows=parseCSV(t);
  if(applySheet(rows)){store.set("sheet",{rows,at:Date.now()});DATA_SRC="таблица обновлена";stampText();render()}
}).catch(()=>{DATA_SRC=cached?"сохранённая копия, нет связи":"встроенные данные, таблица недоступна";stampText()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
